# =============================================================================
# Pipeline Configuration — ocv (OpenClaw cloud-relay plugin)
# =============================================================================
#
# Unlike service-openclaw / service-voice, ocv ships a bundled JS plugin
# (dist/index.mjs), not a Docker image — so there's no rai-cicd-engine build
# import here. The pipeline runs the Vitest suite (unit + contract) and a build
# smoke (`npm run build` must produce the bundle).
#
# Contract tests validate the /api/respond bodies and decoded /api/poll bodies
# against ../openclaw-contracts; they skip automatically when that sibling dir
# isn't present in a single-repo checkout (see src/__tests__/contract.test.ts).
#
# =============================================================================

definitions:
  caches:
    npm-ci: node_modules
  steps:
    - step: &test
        name: Typecheck · Unit · Contract · Build
        image: node:20.10.0
        caches:
          - npm-ci
        script:
          - npm ci
          - npx tsc --noEmit -p tsconfig.json
          - npm test
          - npm run build
        artifacts:
          - dist/**
          - test-results/**

pipelines:
  pull-requests:
    '**':
      - step: *test
  branches:
    'main':
      - step: *test
    'staging':
      - step: *test
    'feature/*':
      - step: *test
    'bugfix/*':
      - step: *test
    'hotfix/*':
      - step: *test
